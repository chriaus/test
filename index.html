<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Courier New", Courier, monospace;
      background:
        radial-gradient(circle at center, rgba(255, 0, 180, 0.25), transparent 35%),
        linear-gradient(#14001f 0%, #050008 60%, #000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.04) 50%, rgba(0,0,0,0.12) 50%),
        linear-gradient(90deg, rgba(255,0,255,0.05), rgba(0,255,255,0.05));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      left: -10%;
      right: -10%;
      bottom: -20%;
      height: 55vh;
      background:
        linear-gradient(to top, rgba(0,255,255,0.55), transparent 2px) 0 0 / 100% 38px,
        linear-gradient(90deg, rgba(255,0,255,0.65), transparent 2px) 0 0 / 54px 100%;
      transform: perspective(420px) rotateX(62deg);
      transform-origin: bottom;
      animation: gridMove 1.2s linear infinite;
      opacity: 0.75;
      pointer-events: none;
    }

    h1 {
      position: relative;
      z-index: 2;
      margin: 0;
      font-size: clamp(4rem, 18vw, 12rem);
      line-height: 1;
      color: #ffea00;
      text-transform: uppercase;
      text-shadow:
        4px 4px 0 #ff00d4,
        8px 8px 0 #00f6ff,
        0 0 18px #ffea00,
        0 0 36px #ff00d4;
      animation: blink 0.85s steps(2, start) infinite;
    }

    @keyframes blink {
      0%, 45% {
        opacity: 1;
        filter: brightness(1.25);
      }
      46%, 100% {
        opacity: 0.45;
        filter: brightness(0.85);
      }
    }

    @keyframes gridMove {
      from {
        background-position: 0 0, 0 0;
      }
      to {
        background-position: 0 38px, 54px 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      h1, body::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <h1>test</h1>
</body>
</html>
